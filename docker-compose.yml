# IMPLEMENTATION_PLAN.md "Phase K" scope item 2. See docs/RUN_GUIDE.md for
# the full, tested command set. Quick start:
#
#   cp .env.example .env
#   docker compose --profile demo up --build
#
# `app` itself carries no `profiles:` tag, so it always starts regardless
# of which --profile flags (if any) are passed - "demo", "docker-socket",
# and "loki-mock" are independent, combinable add-ons on top of it, never
# a prerequisite for it. Real Docker container discovery
# (`--profile docker-socket`) needs the separate
# docker-compose.docker-socket.yml override file layered on top - see
# that file's own header comment for why a profile flag alone can't gate
# a volume mount on an already-defined service, and RUN_GUIDE.md for the
# exact combined command.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: log-explorer:local
    # Legacy Remediation Slice 3 self-exclusion: when `local-docker`
    # discovery is enabled (--profile docker-socket), this label tells the
    # adapter to treat this container as if it did not exist at all -
    # never discovered, never searched, never live-tailed - so Log
    # Explorer never reads its own logs as a "service". See
    # ComposeLabels.EXCLUDED's own javadoc; DockerLogSource checks this
    # exact label/value (case-insensitive "true"), never the container
    # name, before any other filtering.
    labels:
      logexplorer.excluded: "true"
    ports:
      # Legacy Remediation Slice 9 §B: the host-side publish is scoped to
      # 127.0.0.1 - never reachable from outside the host machine, the same
      # "loopback only" property the application's own default (see
      # application.yml) provides for a non-containerized run. SERVER_ADDRESS
      # below is what lets the container's *internal* bind still be 0.0.0.0
      # (required for this host-side publish to reach it at all).
      - "127.0.0.1:${APP_PORT:-3434}:3434"
    environment:
      # Falls back to "dev" (enables the in-process Fixture source) even
      # with no .env file at all - the default happy path genuinely needs
      # no configuration.
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - SERVER_ADDRESS=0.0.0.0
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:3434/actuator/health"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6

  # `--profile demo`: a deterministic, fake-data Spring Boot JSON log feed
  # (tools/demo-log-generator, H1). Emits to its own stdout/stderr - always
  # inspectable with `docker compose logs demo-log-generator` regardless of
  # any other profile. Only visible *inside the app* through the
  # `local-docker` source once `--profile docker-socket` is also active
  # (see that override file) - `app`'s own default happy path uses the
  # Fixture source instead and needs no host Docker access whatsoever.
  demo-log-generator:
    profiles: ["demo"]
    build:
      context: ./tools/demo-log-generator
    command: ["--seed", "${DEMO_LOG_GENERATOR_SEED:-42}"]
    restart: unless-stopped

  # `--profile loki-mock`: an offline stand-in for a real OpenShift Loki
  # gateway (tools/mock-loki, H2), for demonstrating the Loki source path
  # without a real cluster. Point `app` at it via
  # LOGEXPLORER_LOKI_BASE_URL=http://mock-loki:3100 in `.env` (see
  # `.env.example`).
  mock-loki:
    profiles: ["loki-mock"]
    build:
      context: ./tools/mock-loki
    ports:
      - "${MOCK_LOKI_PORT:-3100}:3100"
