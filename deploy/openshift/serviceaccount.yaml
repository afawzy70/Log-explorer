# IMPLEMENTATION_PLAN.md "Phase L". No RBAC role is bound to this
# ServiceAccount by default - the app only ever calls the Loki *gateway*
# over plain HTTPS with its own configured bearer token
# (LOGEXPLORER_LOKI_TOKEN_ENV_VAR/TOKEN_FILE_PATH), never the Kubernetes/
# OpenShift API itself, so no permission is needed for that path. See
# role-and-rolebinding.example.yaml (deliberately not applied by default)
# for the one optional, namespace-scoped exception: some OpenShift Logging
# LokiStack gateways authorize requests via a SubjectAccessReview against
# the caller's own bearer token, in which case an administrator may choose
# to bind this ServiceAccount's own token to a narrow, namespace-scoped
# Role instead of configuring a separate Loki credential.
# Least privilege by default: the token is not even mounted into the pod,
# since the app's primary Loki-gateway path needs no Kubernetes API
# credential at all. Flip this to `true` (and apply
# role-and-rolebinding.example.yaml) only if you're using the optional
# SA-token-as-Loki-credential pattern described there.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-explorer
  labels:
    app.kubernetes.io/name: log-explorer
    app.kubernetes.io/part-of: log-explorer
automountServiceAccountToken: false
