name: JAR Smoke

# MISSION=PR61_DEFAULT_LOG_LEVELS_SINGLE_JAR_AND_USAGE_DOCS - real evidence that the single runnable
# Spring Boot jar (scripts/build-jar.sh) actually works from a clean directory with a plain `java -jar`,
# on the owner's target platform (Windows, mandatory) and, where practical, Linux too. This workflow
# ORCHESTRATES ONLY, matching windows-desktop.yml's own "CI should orchestrate only" convention - the
# real build is scripts/build-jar.sh and the real verification is scripts/jar-packaged-smoke-test.sh, the
# same two repository-owned scripts a developer runs locally; nothing here duplicates their logic.

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/build-jar.sh'
      - 'scripts/jar-packaged-smoke-test.sh'
      - '.github/workflows/jar-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/build-jar.sh'
      - 'scripts/jar-packaged-smoke-test.sh'
      - '.github/workflows/jar-smoke.yml'
  workflow_dispatch: {}

concurrency:
  group: jar-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jar-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: ubuntu-latest
            name: Linux
    name: Build and smoke-test the packaged jar (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The one and only build step - identical to what a developer runs locally
      # (`scripts/build-jar.sh`). Produces backend/target's jar and copies it, renamed, to dist-jar/.
      - name: Build the runnable jar (scripts/build-jar.sh)
        shell: bash
        run: ./scripts/build-jar.sh

      - name: Packaged-jar smoke test (clean directory -> java -jar -> health -> UI -> API -> shutdown)
        shell: bash
        run: |
          jar="$(find dist-jar -maxdepth 1 -name '*.jar' | head -n1)"
          echo "Testing: $jar"
          ./scripts/jar-packaged-smoke-test.sh "$jar"

      - name: Upload the runnable jar (evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-explorer-jar-${{ matrix.name }}
          path: dist-jar/*.jar
          retention-days: 14
          if-no-files-found: warn
