name: Windows Desktop

# Legacy Remediation Slice 9 §AC/§AG, extended by REL-1: real evidence for
# the Windows standalone desktop deliverable, on a real Windows runner -
# not "jpackage/ISCC produced a file" taken on faith. This workflow
# ORCHESTRATES ONLY (REL-1 §13: "CI should orchestrate only... do not
# duplicate packaging implementation inside YAML") - the actual build
# (frontend, backend jar, jlink runtime, launcher publish, installer) is
# scripts/build-desktop-windows.ps1, the SAME repository-owned script a
# developer runs locally (docs/development/BUILD_DESKTOP.md). CI installs
# the platform toolchain, calls that one script, then runs the real
# install -> launch -> health -> UI -> API -> shutdown -> uninstall smoke
# test (desktop/packaging/packaged-smoke-test.ps1) against the genuinely
# installed product.
#
# Also reusable (workflow_call) by .github/workflows/release.yml - the
# automated tag-driven release pipeline calls this SAME workflow for its
# Windows release job, passing `release_version` so the build script
# produces an exact-version artifact instead of the normal `-dev.<sha>`
# CI build - zero duplication of tool setup, the build step, or the
# smoke test between ordinary CI and a real release.
on:
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/build-desktop-windows.ps1'
      - 'VERSION'
      - '.github/workflows/windows-desktop.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/build-desktop-windows.ps1'
      - 'VERSION'
      - '.github/workflows/windows-desktop.yml'
  workflow_dispatch: {}
  workflow_call:
    inputs:
      release_version:
        description: 'Exact release version (e.g. "0.2.0"), passed by release.yml for a tagged release build. Leave unset for a normal dev/CI build.'
        type: string
        required: false
        default: ''

concurrency:
  group: windows-desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-desktop:
    name: Build, package, and smoke-test the Windows desktop app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Windows CI toolchain hardening (platform/windows-dotnet-nuget-
      # restore-hardening) — the repeated `MSB4181: The "RestoreTask" task
      # returned false but did not log an error` failure traced back to
      # this repository never pinning an effective .NET SDK version:
      # without a `global.json`, `dotnet` resolves to the HIGHEST SDK
      # installed on the runner image, not necessarily the 8.0.x SDK
      # `actions/setup-dotnet@v4` just installed above — `windows-latest`
      # images bundle several SDK major versions. `global.json` (repo
      # root) now pins `8.0.100` with `rollForward: latestFeature`. This
      # CI-runner-image-specific self-check is kept here (in addition to
      # the build script's own generic preflight) because it is exactly
      # the regression this hardening pass was created to catch on THIS
      # runner image.
      - name: Verify effective .NET SDK matches the repository-owned contract (global.json)
        shell: pwsh
        run: |
          Write-Host '---- dotnet --info ----'
          dotnet --info
          Write-Host '---- dotnet --list-sdks ----'
          dotnet --list-sdks
          $effective = (dotnet --version).Trim()
          Write-Host "Effective 'dotnet --version' (governed by repository global.json): $effective"
          if ($effective -notlike '8.0.*') {
            Write-Host "##[error] Effective .NET SDK is '$effective', not an 8.0.x SDK. global.json (rollForward=latestFeature) should make this impossible - a preinstalled/newer SDK may be shadowing the repository-owned contract. Failing fast here instead of an opaque MSB4181/RestoreTask failure several steps later."
            exit 1
          }
          Write-Host '---- NuGet sources (from repository nuget.config) ----'
          dotnet nuget list source

      - name: Determine NuGet global packages folder (explicit path, for deterministic caching)
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'nuget-packages'
          Write-Host "NUGET_PACKAGES=$path"
          echo "NUGET_PACKAGES=$path" >> $env:GITHUB_ENV

      - name: Cache NuGet packages (optimization only - the script's own locked-mode restore is the actual correctness source of truth)
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('desktop/launcher/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # The one and only build step - identical to what a developer runs
      # locally. -SkipPreflight because this job has already provisioned
      # exactly what the preflight checks (Java 21, Node, .NET 8 via the
      # setup-* actions above, Inno Setup via choco just above) - running
      # it again would only re-verify what actions/setup-* already
      # guarantees on this runner image. -Version is empty for ordinary
      # CI (workflow_call's own default) - the script's own version
      # resolution (git tag if present, else VERSION + "-dev.<sha>")
      # applies exactly as before; release.yml passes a real version
      # here for a tagged release build.
      - name: Build the Windows desktop package (scripts/build-desktop-windows.ps1)
        shell: pwsh
        run: .\scripts\build-desktop-windows.ps1 -SkipPreflight -Version '${{ inputs.release_version }}'

      - name: Upload current packages.lock.json (evidence - should always equal the committed file byte-for-byte under locked-mode restore)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-lock-json
          path: desktop/launcher/packages.lock.json
          retention-days: 14
          if-no-files-found: warn

      - name: Packaged Windows smoke test (install -> launch -> health -> UI -> API -> shutdown -> uninstall)
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop/build/installer -Filter '*.exe' | Select-Object -First 1
          .\desktop\packaging\packaged-smoke-test.ps1 -InstallerPath $installer.FullName

      # Security sweep of the real built artifact - never upload a
      # package (CI evidence or a real release asset) without this
      # check having run against it. Same pattern as the manual sweep
      # performed for the v0.1.0 release, now automated.
      - name: Scan the built installer for embedded secrets/developer paths
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop/build/installer -Filter '*.exe' | Select-Object -First 1
          $bytes = [System.IO.File]::ReadAllText($installer.FullName, [System.Text.Encoding]::Latin1)
          # Deliberately specific, credential-shaped patterns only - a
          # generic pattern like "password=" would false-positive on
          # unrelated WinForms/.NET boilerplate text and break every
          # release; this gate must not cry wolf.
          $patterns = @('sk-[a-zA-Z0-9]{20,}', 'ghp_[a-zA-Z0-9]{30,}', 'BEGIN RSA PRIVATE', 'BEGIN EC PRIVATE', 'BEGIN OPENSSH PRIVATE', 'OPENSHIFT_TOKEN=', 'D:\\a\\Log-explorer', 'runneradmin')
          $found = @()
          foreach ($p in $patterns) { if ($bytes -match $p) { $found += $p } }
          if ($found.Count -gt 0) {
            Write-Host "##[error] Secret-pattern scan found matches in the built installer: $($found -join ', ')"
            exit 1
          }
          Write-Host 'Secret-pattern scan: no matches - installer is clean'

      - name: Upload installer artifact (installer + checksum, never a development-only diagnostic file)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LogExplorer-windows-installer
          path: |
            desktop/build/installer/*.exe
            desktop/build/installer/*.exe.sha256
          retention-days: 14

      - name: Upload backend log on failure (packaged smoke test diagnostics)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log-on-failure
          path: '%LOCALAPPDATA%\LogExplorer\logs\backend.log'
          retention-days: 14
          if-no-files-found: ignore
