name: macOS Desktop

# REL-1: real evidence for the macOS standalone desktop deliverable, on a
# real macOS runner - not "jpackage produced a file" taken on faith.
# Mirrors windows-desktop.yml's own structure exactly: this workflow
# ORCHESTRATES ONLY (REL-1 §13 - "CI should orchestrate only") - the
# actual build (frontend, backend jar, jlink runtime, launcher-macos
# build, jpackage .app/.dmg) is scripts/build-desktop-macos.sh, the SAME
# repository-owned script a developer runs locally
# (docs/development/BUILD_DESKTOP.md). This job runs in DEV_UNSIGNED_MODE
# (no Apple signing credentials exist in this repository's CI, and none
# are fabricated) and runs the real install -> launch -> health -> UI ->
# API -> shutdown -> uninstall smoke test
# (desktop/packaging-macos/packaged-smoke-test.sh) against the genuinely
# built, genuinely launched product.
#
# Also reusable (workflow_call) by .github/workflows/release.yml - the
# automated tag-driven release pipeline calls this SAME workflow for its
# macOS release job, passing `release_version` so the build script
# produces an exact-version artifact instead of the normal `-dev.<sha>`
# CI build - zero duplication of tool setup, the build step, or the
# smoke test between ordinary CI and a real release.
on:
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/build-desktop-macos.sh'
      - 'VERSION'
      - '.github/workflows/macos-desktop.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/build-desktop-macos.sh'
      - 'VERSION'
      - '.github/workflows/macos-desktop.yml'
  workflow_dispatch: {}
  workflow_call:
    inputs:
      release_version:
        description: 'Exact release version (e.g. "0.2.0"), passed by release.yml for a tagged release build. Leave unset for a normal dev/CI build.'
        type: string
        required: false
        default: ''

concurrency:
  group: macos-desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos-desktop:
    name: Build, package, and smoke-test the macOS desktop app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            desktop/launcher-macos/pom.xml

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The one and only build step - identical to what a developer runs
      # locally. --skip-preflight because this job has already
      # provisioned exactly what the preflight checks (Java 21 and Maven
      # via setup-java above, which also provisions mvn; Node via
      # setup-node above; Xcode command-line tools ship on
      # macos-latest runner images by default). --version is empty for
      # ordinary CI (workflow_call's own default) - the script's own
      # version resolution applies exactly as before; release.yml passes
      # a real version here for a tagged release build. Always
      # DEV_UNSIGNED_MODE - no Apple signing credentials exist in this
      # repository's CI, and none are fabricated (mission's own explicit
      # "never fabricate signing/notarization success"), for CI builds
      # and real tagged releases alike until real credentials exist.
      - name: Build the macOS desktop package (scripts/build-desktop-macos.sh)
        run: ./scripts/build-desktop-macos.sh --mode dev --skip-preflight --version '${{ inputs.release_version }}'

      - name: Packaged macOS smoke test (install -> launch -> health -> UI -> API -> shutdown -> uninstall)
        run: |
          dmg=$(find desktop/build-macos/dmg -maxdepth 1 -name '*.dmg' | head -n1)
          ./desktop/packaging-macos/packaged-smoke-test.sh "$dmg"

      # Security sweep of the real built artifact - never upload a
      # package (CI evidence or a real release asset) without this
      # check having run against it. Same pattern as the manual sweep
      # performed for the v0.1.0 release, now automated.
      - name: Scan the built DMG for embedded secrets/developer paths
        run: |
          dmg=$(find desktop/build-macos/dmg -maxdepth 1 -name '*.dmg' | head -n1)
          patterns='sk-[a-zA-Z0-9]{20,}|ghp_[a-zA-Z0-9]{30,}|BEGIN RSA PRIVATE|BEGIN EC PRIVATE|BEGIN OPENSSH PRIVATE|OPENSHIFT_TOKEN=|/Users/runner'
          if strings "$dmg" | grep -Eq "$patterns"; then
            echo "::error::Secret-pattern scan found a match in the built DMG"
            strings "$dmg" | grep -E "$patterns" | head -5
            exit 1
          fi
          echo 'Secret-pattern scan: no matches - DMG is clean'

      - name: Upload DMG artifact (DMG + checksum, never a development-only diagnostic file)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LogExplorer-macos-dmg
          path: |
            desktop/build-macos/dmg/*.dmg
            desktop/build-macos/dmg/*.dmg.sha256
          retention-days: 14

      - name: Upload backend log on failure (packaged smoke test diagnostics)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log-on-failure-macos
          path: '~/Library/Application Support/LogExplorer/logs/backend.log'
          retention-days: 14
          if-no-files-found: ignore
