spring:
  application:
    name: log-explorer-backend

logging:
  level:
    # Explicit floor, independent of root: Reactor Netty's HTTP wire-tracing
    # dumps raw request/response bytes - including sensitive search filter
    # values - the moment its logger category reaches TRACE. Pinning it here
    # means even an operator who raises root logging for troubleshooting
    # cannot accidentally start logging raw request bodies (CLAUDE.md "never
    # log search values ... via request/access logs").
    reactor.netty: INFO
    io.netty: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logexplorer:
  sources:
    disabled: []
  search:
    default-limit: 200
    max-limit: 5000
    max-time-range: 7d
    request-timeout: 30s
    max-concurrency: 8
    per-source-max-time-range: {}
  docker:
    mode: LOCAL
    port: 2375
    tls: false
    max-containers: 200
    default-tail-lines: 2000
    request-timeout: 10s
    connect-timeout: 5s
  loki:
    gateway-prefix: /api/logs/v1
    tenant: application
    namespace-label-key: kubernetes_namespace_name
    service-label-key: app
    pod-label-key: pod
    container-label-key: container
    max-results-per-query: 2000
    request-timeout: 15s
    connect-timeout: 5s
    raw-log-ql-enabled: false
    live-tail-supported: false
  live:
    max-concurrent-tails: 4
    connection-timeout: 30m
    heartbeat-interval: 15s
    server-buffer-size: 500
