spring:
  application:
    name: log-explorer-backend

server:
  # Legacy Remediation Slice 9 §B/§K: 3434 is the project's formal default
  # port (paired with the frontend dev server's own 3435 - see
  # frontend/vite.config.ts). Never assumed free - the desktop launcher
  # (desktop/) picks an actual port at runtime (preferring 3434, falling
  # back to a free ephemeral one) and always passes it through explicitly
  # via SERVER_PORT, so this default only matters for a bare `java -jar`/
  # `mvnw spring-boot:run` invocation with no override.
  port: ${SERVER_PORT:3434}
  # Loopback-only by default (Slice 9 §B: "Production binding must be
  # 127.0.0.1 only, NOT 0.0.0.0") - correct and safest for the desktop
  # launcher and any other same-machine deployment, where nothing outside
  # this process ever needs to reach it. A containerized deployment
  # (Docker Compose, OpenShift) runs this same process inside its own
  # network namespace, where 127.0.0.1 would make it unreachable even from
  # its own container's published port - those deployments explicitly set
  # SERVER_ADDRESS=0.0.0.0 themselves (see docker-compose.yml,
  # deploy/openshift/configmap.yaml) and achieve the equivalent
  # "never reachable beyond the intended boundary" property at their own
  # layer instead (Compose's host-side port publish scoped to
  # 127.0.0.1, and Kubernetes/OpenShift's Service/NetworkPolicy boundary).
  address: ${SERVER_ADDRESS:127.0.0.1}

logging:
  level:
    # Explicit floor, independent of root: Reactor Netty's HTTP wire-tracing
    # dumps raw request/response bytes - including sensitive search filter
    # values - the moment its logger category reaches TRACE. Pinning it here
    # means even an operator who raises root logging for troubleshooting
    # cannot accidentally start logging raw request bodies (CLAUDE.md "never
    # log search values ... via request/access logs").
    reactor.netty: INFO
    io.netty: INFO
    # Mission "Configurable Log Field Mapping + Original JSON Sampling" §29
    # security review finding: Spring's codec/handler classes share one
    # marker logger (org.springframework.web.HttpLogging - used by
    # CharSequenceEncoder/StringDecoder and others) for a "Writing"/
    # "Decoded" DEBUG summary of the raw, pre-parse request/response body
    # bytes - the wire JSON itself, before any DTO's own toString()
    # redaction ever runs - truncated to a fixed length, not suppressed.
    # LogLeakTest's existing sentinel values happen to sit past that
    # truncation point in its own request shape, so it passed without this
    # ever being exercised - but a shorter body (e.g. the field-mapping
    # settings endpoints' own request/response shapes, which legitimately
    # carry real, unmasked Original Source JSON content by owner design -
    # mission §4) is not truncated before the sensitive value, and would
    # log it verbatim. Pinned to INFO for the same reason reactor.netty/
    # io.netty are: this is a real wire-bytes-logging category, not a
    # DTO-level concern any redacted toString() could fix on its own. See
    # FieldMappingSettingsLeakTest.
    org.springframework.web.HttpLogging: INFO
    # Different call sites (CharSequenceEncoder direct vs. the shared
    # HttpLogging marker logger above) route through different logger
    # names depending on the exact codec path taken - empirically observed
    # to vary run-to-run for the identical code path, so both are pinned
    # rather than assuming either alone is sufficient.
    org.springframework.core.codec: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logexplorer:
  sources:
    disabled: []
  search:
    default-limit: 200
    max-limit: 5000
    max-time-range: 7d
    request-timeout: 30s
    max-concurrency: 8
    per-source-max-time-range: {}
  docker:
    mode: LOCAL
    port: 2375
    tls: false
    max-containers: 200
    default-tail-lines: 2000
    request-timeout: 10s
    connect-timeout: 5s
    remote-allowlist:
      # SSRF/DNS-rebinding policy (Legacy Remediation Slice 3) - empty by
      # default, deny-by-default for loopback/link-local/private-LAN/
      # cloud-metadata addresses. See source.docker.security.RemoteHostGuard.
      cidrs: []
      hostnames: []
  loki:
    gateway-prefix: /api/logs/v1
    tenant: application
    namespace-label-key: kubernetes_namespace_name
    service-label-key: app
    pod-label-key: pod
    container-label-key: container
    max-results-per-query: 2000
    request-timeout: 15s
    connect-timeout: 5s
    raw-log-ql-enabled: false
    # Reserved, currently inert (Legacy Remediation Slice 5) - Loki's
    # capabilities().liveTail() is hardcoded false regardless of this
    # value; see LokiProperties#liveTailSupported's own doc comment.
    live-tail-supported: false
  live:
    max-concurrent-tails: 4
    connection-timeout: 30m
    heartbeat-interval: 15s
    server-buffer-size: 500
