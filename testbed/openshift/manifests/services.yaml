# OS-1F real-Sandbox testbed - the ten logical microservices, their
# OpenShift-visible SERVICE_ROLE identity, and their replica count.
# scripts/deploy.sh reads this file and renders/applies
# deployment-template.yaml once per entry (gateway-service is the one
# exception - it uses gateway-with-sidecar-template.yaml instead, per
# mission §10's multi-container test).
#
# Replica counts follow mission §5 exactly: most services = 1 replica;
# gateway-service, payment-service, customer-service = 2, "enough
# multi-pod behavior without wasting the Sandbox quota."
services:
  - name: gateway-service
    role: GATEWAY
    replicas: 2
    sidecar: true
  - name: customer-service
    role: CUSTOMERS
    replicas: 2
  - name: account-service
    role: ACCOUNTS
    replicas: 1
  - name: payment-service
    role: PAYMENTS
    replicas: 2
  - name: transfer-service
    role: TRANSFERS
    replicas: 1
  - name: beneficiary-service
    role: BENEFICIARIES
    replicas: 1
  - name: notification-service
    role: NOTIFICATIONS
    replicas: 1
  - name: fraud-service
    role: FRAUD
    replicas: 1
  - name: audit-service
    role: AUDIT
    replicas: 1
  - name: statement-service
    role: STATEMENTS
    replicas: 1

# Resource sizing (mission §5) - tuned down further by deploy.sh if the
# real Sandbox quota check (scripts/connect-check.sh) reports less
# headroom than this needs.
resources:
  cpuRequest: 15m
  memoryRequest: 80Mi
  cpuLimit: 150m
  memoryLimit: 160Mi

backgroundIntervalMs: 4000
