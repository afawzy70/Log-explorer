# OS-1F real-Sandbox testbed - the ten logically distinct test services,
# their OpenShift-visible SERVICE_ROLE identity, and their replica count.
# scripts/deploy.sh reads this file and renders/applies
# deployment-template.yaml once per entry (logexp-test-edge is the one
# exception - it uses edge-with-sidecar-template.yaml instead, per
# mission §10's multi-container test).
#
# Every name here uses the generic "logexp-test-<noun>" pattern
# (deliberately not a banking-domain name) - both the OpenShift
# Deployment/Service/Route resource name AND the in-app SERVICE_NAME
# identity (the `application` field in every generated log line), so
# nothing about this test infrastructure implies a real business system.
#
# Replica counts follow mission §5 exactly: most services = 1 replica;
# logexp-test-edge, logexp-test-orders, logexp-test-profile = 2, "enough
# multi-pod behavior without wasting the Sandbox quota."
services:
  - name: logexp-test-edge
    role: EDGE
    replicas: 2
    sidecar: true
  - name: logexp-test-profile
    role: PROFILE
    replicas: 2
  - name: logexp-test-catalog
    role: CATALOG
    replicas: 1
  - name: logexp-test-orders
    role: ORDERS
    replicas: 2
  - name: logexp-test-workflow
    role: WORKFLOW
    replicas: 1
  - name: logexp-test-directory
    role: DIRECTORY
    replicas: 1
  - name: logexp-test-message
    role: MESSAGE
    replicas: 1
  - name: logexp-test-rules
    role: RULES
    replicas: 1
  - name: logexp-test-activity
    role: ACTIVITY
    replicas: 1
  - name: logexp-test-report
    role: REPORT
    replicas: 1

# Resource sizing (mission §5) - tuned down further by deploy.sh if the
# real Sandbox quota check (scripts/connect-check.sh) reports less
# headroom than this needs.
resources:
  cpuRequest: 15m
  memoryRequest: 80Mi
  cpuLimit: 150m
  memoryLimit: 160Mi

backgroundIntervalMs: 4000
