# OS-1F real-Sandbox testbed - one Deployment + Service per logical
# microservice, all sharing the SAME image, differentiated only by
# environment variables. Rendered per service by
# scripts/deploy.sh (envsubst) - never hand-duplicated ten times.
#
# Every resource carries the two labels the cleanup script keys off:
#   app.kubernetes.io/part-of=log-explorer-sandbox-testbed
#   log-explorer-testbed=true
# so `oc delete ... -l log-explorer-testbed=true` removes exactly (and
# only) what this testbed created - never the owner's other Sandbox
# workloads.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${SERVICE_NAME}
  namespace: ${TESTBED_NAMESPACE}
  labels:
    app: ${SERVICE_NAME}
    app.kubernetes.io/part-of: log-explorer-sandbox-testbed
    log-explorer-testbed: "true"
spec:
  replicas: ${REPLICAS}
  selector:
    matchLabels:
      app: ${SERVICE_NAME}
  template:
    metadata:
      labels:
        app: ${SERVICE_NAME}
        app.kubernetes.io/part-of: log-explorer-sandbox-testbed
        log-explorer-testbed: "true"
    spec:
      containers:
        - name: app
          image: ${IMAGE}
          ports:
            - containerPort: 8080
          env:
            - name: SERVICE_NAME
              value: "${SERVICE_NAME}"
            - name: SERVICE_ROLE
              value: "${SERVICE_ROLE}"
            - name: VERSION
              value: "${VERSION}"
            - name: TESTBED_BACKGROUND_INTERVAL_MS
              value: "${TESTBED_BACKGROUND_INTERVAL_MS}"
          resources:
            requests:
              cpu: "${CPU_REQUEST}"
              memory: "${MEMORY_REQUEST}"
            limits:
              cpu: "${CPU_LIMIT}"
              memory: "${MEMORY_LIMIT}"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ${SERVICE_NAME}
  namespace: ${TESTBED_NAMESPACE}
  labels:
    app: ${SERVICE_NAME}
    app.kubernetes.io/part-of: log-explorer-sandbox-testbed
    log-explorer-testbed: "true"
spec:
  selector:
    app: ${SERVICE_NAME}
  ports:
    - port: 8080
      targetPort: 8080
